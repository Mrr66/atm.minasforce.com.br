name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: site_production
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare deployment package
        run: tar -czf deploy.tar.gz dist public package.json package-lock.json ecosystem.config.cjs

      - name: Upload package to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.ATM_SSH_HOST }}
          username: ${{ secrets.ATM_SSH_USER }}
          password: ${{ secrets.ATM_SSH_PASSWORD }}
          port: ${{ secrets.ATM_SSH_PORT }}
          source: deploy.tar.gz
          target: /tmp/atm-minasforce-deploy
          overwrite: true

      - name: Activate release
        uses: appleboy/ssh-action@v1
        env:
          NOTIFIQUE_CLIENT_ID: ${{ vars.NOTIFIQUE_CLIENT_ID }}
          NOTIFIQUE_PASSWORD: ${{ vars.NOTIFIQUE_PASSWORD }}
          NOTIFIQUE_USER: ${{ vars.NOTIFIQUE_USER }}
          NOTIFIQUE_WHATSAPP_NUMBER: ${{ vars.NOTIFIQUE_WHATSAPP_NUMBER }}
        with:
          host: ${{ secrets.ATM_SSH_HOST }}
          username: ${{ secrets.ATM_SSH_USER }}
          password: ${{ secrets.ATM_SSH_PASSWORD }}
          port: ${{ secrets.ATM_SSH_PORT }}
          command_timeout: 10m
          envs: NOTIFIQUE_CLIENT_ID,NOTIFIQUE_PASSWORD,NOTIFIQUE_USER,NOTIFIQUE_WHATSAPP_NUMBER
          script: |
            set -eu
            APP_DIR=/var/www/atm.minasforce.com.br
            PACKAGE=/tmp/atm-minasforce-deploy/deploy.tar.gz
            test -f "$PACKAGE"
            command -v node >/dev/null
            command -v npm >/dev/null
            command -v pm2 >/dev/null
            mkdir -p "$APP_DIR"
            tar -xzf "$PACKAGE" -C "$APP_DIR"
            cd "$APP_DIR"
            npm ci --omit=dev
            umask 077
            {
              printf 'NOTIFIQUE_CLIENT_ID=%s\n' "$NOTIFIQUE_CLIENT_ID"
              printf 'NOTIFIQUE_PASSWORD=%s\n' "$NOTIFIQUE_PASSWORD"
              printf 'NOTIFIQUE_USER=%s\n' "$NOTIFIQUE_USER"
              printf 'NOTIFIQUE_WHATSAPP_NUMBER=%s\n' "$NOTIFIQUE_WHATSAPP_NUMBER"
            } > .env.tmp
            mv .env.tmp .env
            set -a
            if [ -f .env ]; then . ./.env; fi
            set +a
            pm2 startOrReload ecosystem.config.cjs --env production --update-env
            pm2 save
            curl --fail --silent --show-error --retry 10 --retry-delay 2 --retry-connrefused http://127.0.0.1:4321/ >/dev/null
            rm -f "$PACKAGE"
